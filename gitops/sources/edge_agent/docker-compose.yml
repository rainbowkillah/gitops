---
# Portainer Edge Agent
# https://docs.portainer.io/admin/environments/add/edge
# Deploy this stack on each remote host you want Portainer to manage.
# The agent initiates an outbound connection to the Portainer server —
# no inbound firewall rules are required on the remote host.

services:
  portainer_edge_agent:
    image: portainer/agent:${EDGE_AGENT_IMAGE_TAG:-latest}
    container_name: portainer_edge_agent
    restart: unless-stopped

    env_file:
      - stack.env

    environment:
      # Required — Edge key generated by Portainer when you add an Edge environment.
      # Settings > Environments > Add environment > Docker Standalone > Edge Agent
      EDGE_KEY: ${EDGE_KEY:?Set EDGE_KEY in the Portainer stack environment variables or stack.env}

      # ── Connection ─────────────────────────────────────────────────────────
      # Portainer server URL (must be reachable from this host)
      EDGE_INACTIVITY_TIMEOUT: ${EDGE_INACTIVITY_TIMEOUT:-5m}

      # How often (seconds) the agent polls the Portainer server when idle.
      # Lower values increase responsiveness at the cost of more traffic.
      EDGE_POLL_FREQUENCY:     ${EDGE_POLL_FREQUENCY:-5}

      # Agent port used for local API calls from the container engine.
      # Default: 9001
      AGENT_PORT:              ${AGENT_PORT:-9001}

      # Cluster identifier — useful when multiple agents run on the same host.
      # Leave empty for a single-node deployment.
      # AGENT_CLUSTER_ADDR:    ${AGENT_CLUSTER_ADDR:-}

      # ── TLS ────────────────────────────────────────────────────────────────
      # Set to 1 to skip certificate verification for the Portainer server URL.
      # Only use in dev/lab environments — leave as 0 in production.
      EDGE_INSECURE_POLL:      ${EDGE_INSECURE_POLL:-0}

      # ── Logging ────────────────────────────────────────────────────────────
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      # Docker socket — required to manage the local Docker engine
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker volumes root — required for volume management features
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      # Host root — mounted read-only for host-level metadata
      - /:/host:ro
      # Agent persistent state (edge key cache, certificates)
      - portainer_edge_agent_data:/data

    networks:
      - portainer_edge_agent

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:${AGENT_PORT:-9001}/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portainer_edge_agent_data:
    driver: local

networks:
  portainer_edge_agent:
    name: ${EDGE_AGENT_NETWORK_NAME:-portainer_edge_agent}
    driver: bridge
    external: false
