# CertMate — Portainer GitOps stack
# https://www.certmate.org/docs/docker-deployment.html

services:
  certmate:
    # Pin upgrades by changing this tag in Git.
    image: fabriziosalmi/certmate:2.48.3
    container_name: certmate
    restart: unless-stopped

    # Portainer reads these runtime settings from the tracked stack.env file.
    # Keep secrets in Portainer's stack environment variables instead of Git.
    env_file:
      - stack.env

    # Host-local access; put a host-based reverse proxy in front for remote access.
    ports:
      - "127.0.0.1:8001:8001"

    # CertMate stores all application state in these persistent directories.
    volumes:
      - certmate_data:/app/data
      - certmate_certificates:/app/certificates
      - certmate_logs:/app/logs
      - certmate_backups:/app/backups

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  certmate_data:
    driver: local
  certmate_certificates:
    driver: local
  certmate_logs:
    driver: local
  certmate_backups:
    driver: local
