services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG:-latest}
    restart: unless-stopped

    env_file:
      - stack.env

    command:
      - tunnel
      - --loglevel=${TUNNEL_LOGLEVEL:-info}
      - --output=${TUNNEL_LOG_OUTPUT:-default}
      - --metrics=${TUNNEL_METRICS:-0.0.0.0:20241}
      - --protocol=${TUNNEL_TRANSPORT_PROTOCOL:-auto}
      - --edge-ip-version=${TUNNEL_EDGE_IP_VERSION:-4}
      - --grace-period=${TUNNEL_GRACE_PERIOD:-30s}
      - --retries=${TUNNEL_RETRIES:-5}
      - --no-autoupdate
      - run

    environment:
      # Required — tunnel token from Cloudflare Zero Trust > Networking > Tunnels
      # Dashboard: select tunnel > Add a replica > copy the eyJ... token value
      # API:       GET /accounts/{id}/cfd_tunnel/{tunnel_id}/token
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the Portainer stack environment variables or stack.env}

      NO_AUTOUPDATE: "true"

    ports:
      # Prometheus metrics — scoped to localhost; remove if not scraping metrics
      - "127.0.0.1:20241:20241"

    networks:
      - cloudflared

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    healthcheck:
      # /ready returns HTTP 200 only when the tunnel has an active Cloudflare connection
      test: ["CMD", "cloudflared", "tunnel", "ready", "--metrics", "localhost:20241"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Shared network — attach other stacks to this network so cloudflared can reach
  # them by service name.  e.g. origin: http://my-app:8080
  cloudflared:
    name: ${CLOUDFLARED_NETWORK_NAME:-cloudflared}
    driver: bridge
    external: false
